<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Login Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1600&q=80');
    background-size:cover;
    background-position:center;
}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
}

.login-container{
    position:relative;
    z-index:1;
    width:380px;
    padding:40px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    text-align:center;
    color:white;
}

.logo{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid white;
    margin-bottom:15px;
}

h2{
    margin-bottom:25px;
}

.input-group{
    margin-bottom:20px;
    text-align:left;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#00b894;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.links{
    margin-top:15px;
    display:flex;
    justify-content:space-between;
}

.links a{
    color:white;
    text-decoration:none;
    font-size:14px;
}

.message{
    margin-top:15px;
    font-weight:bold;
}

@media(max-width:450px){
    .login-container{
        width:90%;
        padding:30px;
    }
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="login-container">

    <img class="logo"
         src="https://images.unsplash.com/photo-1500648767791-00dcc994a43?auto=format&fit=crop&w=300&q=80"
         alt="User">

    <h2>Welcome Back</h2>

    <form id="loginForm">

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter Email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter Password" required>
        </div>

        <button type="submit" class="btn">
            Login
        </button>

    </form>

    <div class="links">
        <a href="#">Forgot Password?</a>
        <a href="#">Register</a>
    </div>

    <div class="message" id="message"></div>

</div>

<script>

document.getElementById("loginForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    let message = document.getElementById("message");

    if(email === "admin@gmail.com" && password === "123456"){
        message.style.color = "#00ff99";
        message.innerHTML = "✓ Login Successful";
    }
    else{
        message.style.color = "#ff6b6b";
        message.innerHTML = "✗ Invalid Email or Password";
    }

});

</script>

</body>
</html>
